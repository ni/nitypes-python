name: Check nitypes

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  check_nitypes:
    name: Check nitypes
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Type checking requires an up-to-date NumPy.
        # The latest NumPy only supports 3.11 and later
        python-version: [3.11, 3.15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@5b65c39ed45a0e5b51f584f408edf89955c9cee6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@5b65c39ed45a0e5b51f584f408edf89955c9cee6
      - name: Analyze Python project
        uses: ni/python-actions/analyze-project@5b65c39ed45a0e5b51f584f408edf89955c9cee6
      - name: Bandit security checks
        run:  poetry run bandit -c pyproject.toml -r src/nitypes
